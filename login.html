<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Asset Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="LStyle.css">
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <i class=" bi bi-shield-lock"></i>
            <h1>NTHUNGULULU MEDIA</h1>
            <h2>Asset Management System</h2>
            <p class="text-muted">Staff-Login</p>
        </div>

        <form id="loginForm">
            <div class="form-floating mb-3">>
                <input type="text" class="form-control" id="employeeName" placeholder="Mavuto Problema">
                <label for="employeeName">Full Name</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="employeeId" placeholder="ID Number" required>
                <label for="employeeId">Staff ID Number</label>
            </div>

            <div class="d-grid gap-2 mb-3">
                <button type="sumbit" class="btn btn-primary btn-login">
                    <i class="bi bi-box-arrow-right me-2"></i>Login
                </button>
            </div>
            <div class="footer-links">
                <p class="text-muted">Contact IT support for assistance</p>
            </div>
        </form>
    </div>
</body>



</html>
